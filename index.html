<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จับสลาก สุ่มของรางวัล 155 ป้าย</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #1a73e8;
            margin-bottom: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 10px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: transparent;
            width: 100%;
            height: 85px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card.disabled {
            cursor: default;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .card-front {
            background-color: #e8f0fe;
            border: 2px solid #ccc;
            font-size: 14px;
            color: #555;
            font-weight: bold;
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-back {
            background: linear-gradient(135deg, #ff4e50, #f9d423);
            color: white;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #fff;
            transform: rotateY(180deg);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <h1>จับสลาก สุ่มของรางวัล</h1>

    <div class="grid-container" id="gridContainer"></div>

    <script>
        const TOTAL_CARDS = 155;
        let shuffledNumbers = [];

        function generateShuffledNumbers() {
            shuffledNumbers = Array.from({length: TOTAL_CARDS}, (_, i) => i + 1);
            for (let i = shuffledNumbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledNumbers[i], shuffledNumbers[j]] = [shuffledNumbers[j], shuffledNumbers[i]];
            }
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playFlipSound() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);

            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function createBoard() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            for (let i = 0; i < TOTAL_CARDS; i++) {
                const cardIndex = i + 1;
                const randomNumber = shuffledNumbers[i];

                const card = document.createElement('div');
                card.className = 'card';

                card.onclick = function() {
                    if (!card.classList.contains('flipped')) {
                        playFlipSound();
                        card.classList.add('flipped', 'disabled');
                    }
                };

                const cardInner = document.createElement('div');
                cardInner.className = 'card-inner';

                const cardFront = document.createElement('div');
                cardFront.className = 'card-front';
                
                const img = document.createElement('img');
                
                img.src = `${cardIndex}.jpg`;
                img.alt = `Photo ${cardIndex}`;

                let attempts = 0;
                const extensions = ['.JPG', '.jpeg', '.png', '.PNG'];

                img.onerror = function() {
                    if (attempts < extensions.length) {
                        this.src = `${cardIndex}${extensions[attempts]}`;
                        attempts++;
                    } else {
                        this.style.display = 'none';
                        cardFront.innerText = `รูปที่ ${cardIndex}`;
                    }
                };

                cardFront.appendChild(img);

                const cardBack = document.createElement('div');
                cardBack.className = 'card-back';
                cardBack.innerText = randomNumber;

                cardInner.appendChild(cardFront);
                cardInner.appendChild(cardBack);
                card.appendChild(cardInner);
                container.appendChild(card);
            }
        }

        generateShuffledNumbers();
        createBoard();
    </script>
</body>
</html>
